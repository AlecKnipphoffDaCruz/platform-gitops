# Instala o Argo CD (versão fixa) no namespace argocd.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml
  - ingress.yaml
patches:
  # TLS fica no ingress (ou nenhum, localmente), então o server roda em HTTP.
  - target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
    patch: |-
      - op: add
        path: /data
        value:
          server.insecure: "true"
