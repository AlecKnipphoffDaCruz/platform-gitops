apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-b
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: web
          image: app-front-b   # nome lógico; o overlay troca pelo registry + tag
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
