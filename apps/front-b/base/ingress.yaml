apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: front-b
spec:
  ingressClassName: traefik
  rules:
    - host: front-b.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: front-b
                port:
                  name: http
