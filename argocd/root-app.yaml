# App of Apps: o Argo lê a pasta argocd/apps e cria uma Application
# para cada arquivo lá dentro. É esse arquivo que "liga" tudo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AlecKnipphoffDaCruz/platform-gitops.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
