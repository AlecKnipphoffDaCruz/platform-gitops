apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: front-b-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AlecKnipphoffDaCruz/platform-gitops.git
    targetRevision: main
    path: apps/front-b/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: front-b-dev
  syncPolicy:
    automated:
      prune: true     # apaga do cluster o que sumiu do Git
      selfHeal: true  # desfaz mudanças manuais feitas com kubectl
    syncOptions:
      - CreateNamespace=true
